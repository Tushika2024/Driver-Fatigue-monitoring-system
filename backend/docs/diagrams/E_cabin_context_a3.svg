<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1600 1131">
<style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#2C2C2A}
.title{font-size:34px;font-weight:600}
.sub{font-size:16px;fill:#5F5E5A}
.ph{font-size:19px;font-weight:600;fill:#3C3489}
.bt{font-size:15px;font-weight:600}
.bb{font-size:13px;fill:#444441}
.tb{font-size:12.5px;fill:#2C2C2A}
.th{font-size:12.5px;font-weight:600;fill:#2C2C2A}
.al{font-size:12px;fill:#5F5E5A;font-style:italic}
.nt{font-size:12.5px;fill:#444441}
.nh{font-size:14px;font-weight:600;fill:#2C2C2A}
.box{fill:#F7F6F3;stroke:#73726C;stroke-width:1}
.proc{fill:#E6F1FB;stroke:#185FA5;stroke-width:1}
.dec{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.loud{fill:#EAF3DE;stroke:#3B6D11;stroke-width:1.2}
.priv{fill:#FAECE7;stroke:#993C1D;stroke-width:1.2}
.mild{fill:#EAF3DE;stroke:#3B6D11;stroke-width:1.2}
.mod{fill:#FAEEDA;stroke:#854F0B;stroke-width:1.2}
.sev{fill:#FCEBEB;stroke:#A32D2D;stroke-width:1.2}
.fut{fill:#F7F6F3;stroke:#73726C;stroke-width:1.2;stroke-dasharray:6 4}
.panel{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:5 4}
.note{fill:#F1EFE8;stroke:#B4B2A9;stroke-width:1}
.ar{stroke:#5F5E5A;stroke-width:1.4;fill:none;marker-end:url(#a)}
.rw{stroke:#D3D1C7;stroke-width:0.8}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="1600" height="1131" fill="#FFFFFF"/>
<text class="title" x="40" y="48">E · Cabin context — how the warning is chosen</text>
<text class="sub" x="40" y="74">Every drowsiness system assumes a loud alarm is the right answer. In an ambulance with a patient aboard it is not. We make the intervention a function of the cabin.</text>
<line x1="40" y1="96" x2="1560" y2="96" stroke="#B4B2A9" stroke-width="1"/>

<rect class="panel" x="40" y="118" width="360" height="560" rx="8"/>
<text class="ph" x="58" y="146">1 · Three cabin properties</text>
<text class="bb" x="58" y="168">Vehicle type is only a preset for these three flags</text>

<rect class="dec" x="70" y="184" width="300" height="106" rx="5"/>
<text class="bt" x="220" y="208" text-anchor="middle">P1 · OTHERS PRESENT?</text>
<text class="bb" x="92" y="234">Can anyone else in this cabin be</text>
<text class="bb" x="92" y="254">disturbed by a loud alert?</text>
<text class="bb" x="92" y="278">patient · sleeping co-driver · passengers</text>

<rect class="dec" x="70" y="304" width="300" height="106" rx="5"/>
<text class="bt" x="220" y="328" text-anchor="middle">P2 · SECOND DRIVER?</text>
<text class="bb" x="92" y="354">Is there another qualified driver on</text>
<text class="bb" x="92" y="374">board right now?</text>
<text class="bb" x="92" y="398">If yes, the best response is not an alert</text>

<rect class="dec" x="70" y="424" width="300" height="126" rx="5"/>
<text class="bt" x="220" y="448" text-anchor="middle">P3 · OVERHEARING HARMFUL?</text>
<text class="bb" x="92" y="474">Does an alert heard by others cause</text>
<text class="bb" x="92" y="494">harm of its own?</text>
<text class="bb" x="92" y="518">"Pull over now" heard by a patient's</text>
<text class="bb" x="92" y="538">family causes panic. That is a real cost.</text>

<path class="ar" d="M220 550 L220 578"/>

<rect class="proc" x="70" y="580" width="300" height="76" rx="5"/>
<text class="bt" x="220" y="604" text-anchor="middle">vehicle_profile.yaml</text>
<text class="bb" x="220" y="626" text-anchor="middle">three booleans — that is the whole file</text>
<text class="bb" x="220" y="646" text-anchor="middle">read by the alert policy at startup</text>

<rect class="note" x="40" y="708" width="360" height="382" rx="8"/>
<text class="nh" x="60" y="736">Why properties, not a list of vehicles</text>
<text class="nt" x="60" y="764">A hardcoded list of vehicle types is brittle and does</text>
<text class="nt" x="60" y="782">not generalise. Three properties cover vehicles you</text>
<text class="nt" x="60" y="800">never anticipated — a driving instructor's car, a</text>
<text class="nt" x="60" y="818">prison transport, a hearse.</text>
<text class="nt" x="60" y="836">It is also easier to defend: the logic follows from</text>
<text class="nt" x="60" y="854">the properties rather than from your opinion.</text>

<text class="nh" x="60" y="894">Two rows change mid-shift</text>
<text class="nt" x="60" y="922">An ambulance running empty is a different cabin from</text>
<text class="nt" x="60" y="940">one carrying a patient. A taxi with a fare is</text>
<text class="nt" x="60" y="958">different from one cruising for the next one.</text>
<text class="nt" x="60" y="986">Handle this with a manual toggle — the crew marks</text>
<text class="nt" x="60" y="1004">"patient aboard" the way they already log other</text>
<text class="nt" x="60" y="1022">things. Do not build automatic occupancy detection:</text>
<text class="nt" x="60" y="1040">it is a second project, and it will be wrong at the</text>
<text class="nt" x="60" y="1058">worst possible moment.</text>

<rect class="panel" x="430" y="118" width="440" height="560" rx="8"/>
<text class="ph" x="448" y="146">2 · Presets</text>

<rect x="456" y="168" width="388" height="30" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
<text class="th" x="466" y="188">Vehicle / state</text>
<text class="th" x="672" y="188" text-anchor="middle">P1</text>
<text class="th" x="712" y="188" text-anchor="middle">P2</text>
<text class="th" x="752" y="188" text-anchor="middle">P3</text>
<text class="th" x="838" y="188" text-anchor="end">Channel</text>

<rect x="456" y="198" width="388" height="34" fill="#EAF3DE" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="tb" x="466" y="220">Goods truck, solo driver</text>
<text class="tb" x="672" y="220" text-anchor="middle">no</text>
<text class="tb" x="712" y="220" text-anchor="middle">no</text>
<text class="tb" x="752" y="220" text-anchor="middle">no</text>
<text class="th" x="838" y="220" text-anchor="end">cabin, loud</text>

<rect x="456" y="232" width="388" height="34" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="tb" x="466" y="254">Goods truck, team sleeper</text>
<text class="tb" x="672" y="254" text-anchor="middle">yes</text>
<text class="tb" x="712" y="254" text-anchor="middle">yes</text>
<text class="tb" x="752" y="254" text-anchor="middle">no</text>
<text class="tb" x="838" y="254" text-anchor="end">private + handover</text>

<rect x="456" y="266" width="388" height="34" fill="#FAECE7" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="tb" x="466" y="288">Ambulance, patient aboard</text>
<text class="tb" x="672" y="288" text-anchor="middle">yes</text>
<text class="tb" x="712" y="288" text-anchor="middle">yes</text>
<text class="tb" x="752" y="288" text-anchor="middle">yes</text>
<text class="th" x="838" y="288" text-anchor="end">private + handover</text>

<rect x="456" y="300" width="388" height="34" fill="#EAF3DE" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="tb" x="466" y="322">Ambulance, running empty</text>
<text class="tb" x="672" y="322" text-anchor="middle">no</text>
<text class="tb" x="712" y="322" text-anchor="middle">yes</text>
<text class="tb" x="752" y="322" text-anchor="middle">no</text>
<text class="tb" x="838" y="322" text-anchor="end">cabin audio</text>

<rect x="456" y="334" width="388" height="34" fill="#FAECE7" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="tb" x="466" y="356">Bus or coach</text>
<text class="tb" x="672" y="356" text-anchor="middle">yes</text>
<text class="tb" x="712" y="356" text-anchor="middle">no</text>
<text class="tb" x="752" y="356" text-anchor="middle">yes</text>
<text class="tb" x="838" y="356" text-anchor="end">private only</text>

<rect x="456" y="368" width="388" height="34" fill="#FAECE7" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="tb" x="466" y="390">School bus</text>
<text class="tb" x="672" y="390" text-anchor="middle">yes</text>
<text class="tb" x="712" y="390" text-anchor="middle">no</text>
<text class="tb" x="752" y="390" text-anchor="middle">yes</text>
<text class="tb" x="838" y="390" text-anchor="end">private only</text>

<rect x="456" y="402" width="388" height="34" fill="#FAECE7" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="tb" x="466" y="424">Taxi, passenger aboard</text>
<text class="tb" x="672" y="424" text-anchor="middle">yes</text>
<text class="tb" x="712" y="424" text-anchor="middle">no</text>
<text class="tb" x="752" y="424" text-anchor="middle">yes</text>
<text class="tb" x="838" y="424" text-anchor="end">private only</text>

<rect x="456" y="436" width="388" height="34" fill="#EAF3DE" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="tb" x="466" y="458">Taxi, empty</text>
<text class="tb" x="672" y="458" text-anchor="middle">no</text>
<text class="tb" x="712" y="458" text-anchor="middle">no</text>
<text class="tb" x="752" y="458" text-anchor="middle">no</text>
<text class="tb" x="838" y="458" text-anchor="end">cabin audio</text>

<rect x="456" y="470" width="388" height="34" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="tb" x="466" y="492">Private car</text>
<text class="tb" x="672" y="492" text-anchor="middle">?</text>
<text class="tb" x="712" y="492" text-anchor="middle">?</text>
<text class="tb" x="752" y="492" text-anchor="middle">?</text>
<text class="tb" x="838" y="492" text-anchor="end">driver sets it</text>

<rect class="loud" x="456" y="526" width="388" height="64" rx="5"/>
<text class="bt" x="476" y="550">The solo truck is the permissive case</text>
<text class="bb" x="476" y="572">A driver alone at 3am is exactly who benefits from a loud</text>
<text class="bb" x="476" y="586">alarm. The system should use it, not be needlessly gentle.</text>

<rect class="priv" x="456" y="602" width="388" height="64" rx="5"/>
<text class="bt" x="476" y="626">Most design effort goes to constrained cabins</text>
<text class="bb" x="476" y="648">But say the permissive case out loud in the report, or it</text>
<text class="bb" x="476" y="662">looks like you only thought about one kind of vehicle.</text>

<rect class="note" x="430" y="708" width="440" height="382" rx="8"/>
<text class="nh" x="450" y="736">The ambulance is the hard case, and the reason why</text>
<text class="nt" x="450" y="764">There is a patient in the back, possibly critical, possibly conscious</text>
<text class="nt" x="450" y="782">and frightened. There are paramedics working — placing a line,</text>
<text class="nt" x="450" y="800">managing an airway — for whom a sudden alarm is a startle hazard at</text>
<text class="nt" x="450" y="818">exactly the wrong moment.</text>
<text class="nt" x="450" y="846">The cabin is already saturated with alarms: monitors, siren, radio.</text>
<text class="nt" x="450" y="864">Adding one more is the textbook definition of alarm fatigue, and the</text>
<text class="nt" x="450" y="882">standard response to alarm fatigue is that people stop reacting.</text>
<text class="nt" x="450" y="910">Meanwhile EMS drivers are among the most fatigued on the road — long</text>
<text class="nt" x="450" y="928">shifts, night work, irregular sleep. So this is a population that</text>
<text class="nt" x="450" y="946">needs detection more than average, and for whom the standard</text>
<text class="nt" x="450" y="964">intervention is least appropriate.</text>
<text class="nt" x="450" y="992">That is the gap. Not "nobody has built this yet" in the trivial</text>
<text class="nt" x="450" y="1010">sense, but: the whole field made an assumption that does not hold</text>
<text class="nt" x="450" y="1028">here, and nobody checked it.</text>
<text class="nt" x="450" y="1056">Honest scope note: the detection model is trained on general data.</text>
<text class="nt" x="450" y="1074">The ambulance-specific part is the intervention design. Say so.</text>

<rect class="panel" x="900" y="118" width="660" height="560" rx="8"/>
<text class="ph" x="918" y="146">3 · Two-axis escalation</text>
<text class="bb" x="918" y="168">When you cannot get louder, escalate the recipient instead</text>

<rect x="926" y="186" width="200" height="38" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
<text class="th" x="946" y="210">Level</text>
<rect x="1126" y="186" width="200" height="38" fill="#EAF3DE" stroke="#B4B2A9" stroke-width="0.8"/>
<text class="th" x="1226" y="210" text-anchor="middle">Goods truck, solo</text>
<rect x="1326" y="186" width="208" height="38" fill="#FAECE7" stroke="#B4B2A9" stroke-width="0.8"/>
<text class="th" x="1430" y="210" text-anchor="middle">Ambulance, patient</text>

<rect x="926" y="224" width="200" height="62" fill="#EAF3DE" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="th" x="946" y="248">MILD</text>
<text class="tb" x="946" y="270">early signals only</text>
<rect x="1126" y="224" width="200" height="62" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="tb" x="1146" y="260">Soft chime, cabin</text>
<rect x="1326" y="224" width="208" height="62" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="tb" x="1346" y="260">Private chime</text>

<rect x="926" y="286" width="200" height="62" fill="#FAEEDA" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="th" x="946" y="310">MODERATE</text>
<text class="tb" x="946" y="332">early + late</text>
<rect x="1126" y="286" width="200" height="62" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="tb" x="1146" y="314">Voice prompt, cabin,</text>
<text class="tb" x="1146" y="334">with the reason</text>
<rect x="1326" y="286" width="208" height="62" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="tb" x="1346" y="314">Private voice, low</text>
<text class="tb" x="1346" y="334">volume, with reason</text>

<rect x="926" y="348" width="200" height="76" fill="#FCEBEB" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="th" x="946" y="372">SEVERE</text>
<text class="tb" x="946" y="394">late, sustained</text>
<rect x="1126" y="348" width="200" height="76" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="tb" x="1146" y="376">Loud alarm, repeated</text>
<text class="tb" x="1146" y="396">until acknowledged</text>
<rect x="1326" y="348" width="208" height="76" fill="#FAEEDA" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="tb" x="1346" y="376">Private voice PLUS</text>
<text class="tb" x="1346" y="396">notify the crew member</text>
<text class="tb" x="1346" y="414">in back, on their device</text>

<rect x="926" y="424" width="200" height="62" fill="#F7C1C1" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="th" x="946" y="448">CRITICAL</text>
<text class="tb" x="946" y="470">ignored severe</text>
<rect x="1126" y="424" width="200" height="62" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="tb" x="1146" y="460">— no higher level</text>
<rect x="1326" y="424" width="208" height="62" fill="#F7C1C1" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="tb" x="1346" y="460">Notify dispatch</text>

<rect class="proc" x="926" y="516" width="608" height="68" rx="5"/>
<text class="bt" x="946" y="540">The truck escalates INTENSITY. The ambulance escalates RECIPIENT.</text>
<text class="bb" x="946" y="564">Every existing system escalates along one axis only. Which axis is used depends on the cabin.</text>

<rect class="dec" x="926" y="596" width="608" height="68" rx="5"/>
<text class="bt" x="946" y="620">A paramedic glancing at their phone beats any noise</text>
<text class="bb" x="946" y="644">"Driver fatigue — consider swapping at the next stop." Silent to the patient, and it reaches someone who can act.</text>

<rect class="note" x="900" y="708" width="326" height="382" rx="8"/>
<text class="nh" x="920" y="736">The default when nobody set it</text>
<text class="nt" x="920" y="764">A real tension, and you should name it</text>
<text class="nt" x="920" y="782">rather than paper over it.</text>
<text class="nt" x="920" y="810">Safety says default loud: a missed alert</text>
<text class="nt" x="920" y="828">can kill. Context says default private:</text>
<text class="nt" x="920" y="846">waking a patient is harm you caused.</text>
<text class="nt" x="920" y="874">The resolution: default to the private</text>
<text class="nt" x="920" y="892">channel, but never suppress the severe</text>
<text class="nt" x="920" y="910">level — only redirect it.</text>
<text class="nt" x="920" y="938">If no second person and no dispatch</text>
<text class="nt" x="920" y="956">exists, fall back to cabin audio at</text>
<text class="nt" x="920" y="974">severe regardless of the setting, and</text>
<text class="nt" x="920" y="992">announce that it is doing so.</text>
<text class="nt" x="920" y="1020">You never silently reduce protection.</text>
<text class="nt" x="920" y="1038">You only change who gets told first.</text>
<text class="nt" x="920" y="1066">That is the sentence for the viva.</text>

<rect class="note" x="1240" y="708" width="320" height="382" rx="8"/>
<text class="nh" x="1260" y="736">Future scope — hardware</text>
<text class="nt" x="1260" y="762">Not built this semester. Everything</text>
<text class="nt" x="1260" y="780">above runs on software alone.</text>

<rect class="fut" x="1260" y="796" width="280" height="80" rx="5"/>
<text class="bt" x="1276" y="818">Bone-conduction headset</text>
<text class="bb" x="1276" y="838">Ears stay open, so ambient sound</text>
<text class="bb" x="1276" y="854">and sirens are still heard. Normal</text>
<text class="bb" x="1276" y="870">earphones while driving are illegal.</text>

<rect class="fut" x="1260" y="884" width="280" height="80" rx="5"/>
<text class="bt" x="1276" y="906">Single Bluetooth earpiece</text>
<text class="bb" x="1276" y="926">One ear free. Cheap. But it must be</text>
<text class="bb" x="1276" y="942">worn, which is a compliance</text>
<text class="bb" x="1276" y="958">dependency a seat actuator avoids.</text>

<rect class="fut" x="1260" y="972" width="280" height="98" rx="5"/>
<text class="bt" x="1276" y="994">Seat or steering vibration</text>
<text class="bb" x="1276" y="1014">Fully independent of cabin acoustics.</text>
<text class="bb" x="1276" y="1030">Private to the driver, immune to the</text>
<text class="bb" x="1276" y="1046">noise floor, nothing to wear. ESP32</text>
<text class="bb" x="1276" y="1062">plus an ERM motor, roughly ₹500.</text>

<line x1="40" y1="1104" x2="1560" y2="1104" stroke="#B4B2A9" stroke-width="1"/>
<text class="al" x="40" y="1122">E · Cabin context · phone-deployable driver fatigue monitoring · A3 landscape</text>
</svg>
